<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>子弹价格趋势</title>
<style>body{margin:0;background:#eff5f4;color:#173237;font:15px system-ui,"Microsoft YaHei",sans-serif}.w{max-width:1050px;margin:auto;padding:28px 16px}h1{margin:4px 0}p,.muted{color:#557077}.box{background:#fff;border:1px solid #d7e4e2;border-radius:12px;padding:18px;margin:16px 0}.stats,.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.card{padding:12px;text-align:left;background:#fff;border:1px solid #d7e4e2;border-radius:9px;cursor:pointer}.card.active{border:2px solid #087e80}.card b{font-size:20px}select,input,button{padding:9px;border:1px solid #aac4c1;border-radius:7px;background:#fff;font:inherit}label{display:inline-grid;gap:5px;margin:0 12px 12px 0}.price{font-size:30px;font-weight:700}svg{display:block;width:100%;height:290px}@media(max-width:650px){.stats,.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:400px){.stats,.grid{grid-template-columns:1fr}}</style>
<main class="w"><header><div class="muted">DELTA FORCE · OBSERVED PRICES</div><h1>子弹价格趋势</h1><p id="time">正在读取数据…</p><button onclick="load()">刷新</button></header><section class="box stats"><div>子弹种类<br><b id="count">—</b></div><div>已保存批次<br><b id="batches">—</b></div><div>最后采集<br><b id="last">—</b></div></section><section class="box"><label>选择子弹<select id="ammo"></select></label><label>搜索名称<input id="q" placeholder="输入子弹名称"></label><div id="detail"></div><svg id="chart" viewBox="0 0 900 290"></svg></section><section class="box"><span class="muted" id="result"></span><div class="grid" id="grid"></div></section><p class="muted">来源：Orzice 公开“当前价格”表格。0 为网页原值。</p></main>
<script>
var d,names,selected;var $=function(x){return document.getElementById(x)};var num=function(x){return x===0?'0':x==null?'—':Number(x).toLocaleString('zh-CN')};var when=function(x){return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x))};var latest=function(){return d.snapshots[d.snapshots.length-1]};function series(n){return d.snapshots.map(function(s){var r=s.rows.find(function(x){return x.name===n});return {t:s.capturedAt,v:r?r.price:null}})}function show(n){selected=n;$('ammo').value=n;var a=series(n),p=a[a.length-1];$('detail').innerHTML='<b>'+n+'</b><div class="price">'+num(p.v)+'</div><div class="muted">最后记录：'+when(p.t)+'</div>';var ok=a.filter(function(x){return x.v>0}),svg=$('chart');if(!ok.length){svg.innerHTML='<text x="20" y="60">暂无有效价格记录</text>';return}var lo=Math.min.apply(null,ok.map(function(x){return x.v})),hi=Math.max.apply(null,ok.map(function(x){return x.v}));if(lo===hi){lo=Math.max(0,lo-1);hi=hi+1}var x=function(i){return 45+i*830/Math.max(1,a.length-1)},y=function(v){return 250-(v-lo)*200/(hi-lo)},path='';a.forEach(function(p,i){if(p.v>0)path+=(path?' L':'M')+x(i)+','+y(p.v)});svg.innerHTML='<line x1="45" y1="250" x2="875" y2="250" stroke="#aac4c1"/><text x="2" y="35">'+num(hi)+'</text><text x="2" y="250">'+num(lo)+'</text><path d="'+path+'" fill="none" stroke="#087e80" stroke-width="3"/>';render()}function render(){var q=$('q').value.toLowerCase(),a=names.filter(function(n){return n.toLowerCase().includes(q)});$('result').textContent='显示 '+a.length+' / '+names.length+' 款';$('grid').innerHTML=a.map(function(n){var p=series(n).pop();return '<button class="card '+(n===selected?'active':'')+'" data-n="'+n.replaceAll('&','&amp;').replaceAll('"','&quot;')+'"><b>'+n+'</b><br>'+num(p.v)+'</button>'}).join('');document.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){show(b.dataset.n)}})}function load(){fetch('data/ammo-history.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(x){d=x;names=[].concat.apply([],d.snapshots.map(function(s){return s.rows.map(function(r){return r.name})})).filter(function(n,i,a){return a.indexOf(n)===i}).sort();var s=latest();$('count').textContent=names.length;$('batches').textContent=d.snapshots.length;$('last').textContent=when(s.capturedAt);$('time').textContent='最后成功采集：'+when(s.capturedAt)+'（北京时间）';$('ammo').innerHTML=names.map(function(n){return '<option>'+n+'</option>'}).join('');$('ammo').onchange=function(e){show(e.target.value)};$('q').oninput=render;show(names[0])}).catch(function(){$('detail').textContent='暂时无法读取数据，请稍后刷新。'})}load();
</script>
