function chart(points){
 const W=700,H=122,L=53,R=14,T=12,B=27;const valid=points.filter(p=>p.p>0);
 if(!valid.length)return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="暂无有效报价"><text x="${W/2}" y="${H/2}" text-anchor="middle">暂无有效报价</text></svg>`;
 const min=Math.min(...valid.map(p=>p.p)),max=Math.max(...valid.map(p=>p.p));const pad=Math.max(1,Math.round((max-min||max)*.12));const lo=Math.max(0,min-pad),hi=max+pad;const first=points[0].t,last=points.at(-1).t,span=Math.max(1,last-first);const x=t=>L+(t-first)/span*(W-L-R),y=p=>T+(hi-p)/(hi-lo)*(H-T-B);let d='',open=false;

}
function render(history){const snaps=history.snapshots||[];if(!snaps.length)throw new Error('没有可展示的历史数据');const latest=snaps.at(-1),latestMap=new Map(latest.rows.map(r=>[r.name,r]));const names=latest.rows.map(r=>r.name);const getPoints=name=>snaps.map(s=>({t:new Date(s.capturedAt).getTime(),p:s.rows.find(r=>r.name===name)?.price??0}));$('total').textContent=fmt(names.length);$('batches').textContent=fmt(snaps.length);$('last').textContent=time(latest.capturedAt);$('status').textContent=`最后成功采集：${time(latest.capturedAt)}（北京时间）`;
function cards(){let list=names.filter(n=>n.toLowerCase().includes($('search').value.trim().toLowerCase()));const sort=$('sort').value;if(sort==='name')list.sort((a,b)=>a.localeCompare(b,'zh-CN'));if(sort.startsWith('price'))list.sort((a,b)=>{const d=(latestMap.get(a)?.price||0)-(latestMap.get(b)?.price||0);return sort==='price-desc'?-d:d});$('count').textContent=`显示 ${list.length} / ${names.length} 款`;$('grid').innerHTML=list.length?list.map(n=>{const row=latestMap.get(n),ps=getPoints(n),prev=ps.at(-2)?.p||0,delta=row.price>0&&prev>0?((row.price-prev)/prev*100).toFixed(1)+'%':'等待更多记录';return `<article class="ammo-card"><div class="ammo-info">${icon(n)}<div><div class="ammo-name">${esc(n)}</div><div class="price">${row.price>0?fmt(row.price):'—'}</div><div class="price-label">当前价格 · ${delta}</div></div></div><div class="chart-wrap">${chart(ps)}</div></article>`}).join(''):'<div class="empty">没有匹配的子弹，试试其他名称。</div>'}
$('search').addEventListener('input',cards);$('sort').addEventListener('change',cards);cards()}
async function load(){try{const res=await fetch('data/ammo-history.json?'+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('读取失败');render(await res.json())}catch(e){$('status').textContent='暂时无法读取数据，请稍后刷新。';$('grid').innerHTML='<div class="empty">数据加载失败</div>'}}
const pointTooltip=document.createElement('div');pointTooltip.id='point-tooltip';pointTooltip.setAttribute('role','status');document.body.append(pointTooltip);
function hidePointTooltip(){pointTooltip.classList.remove('show')}
function showPointTooltip(point,x,y){pointTooltip.innerHTML=`采集时间：${point.dataset.time}（北京时间）<br>价格：${point.dataset.price}`;pointTooltip.classList.add('show');const left=Math.min(window.innerWidth-pointTooltip.offsetWidth-12,x+14);const top=Math.max(10,y-pointTooltip.offsetHeight-12);pointTooltip.style.left=`${Math.max(10,left)}px`;pointTooltip.style.top=`${top}px`}
document.addEventListener('pointermove',e=>{const point=e.target.closest?.('.point');if(point)showPointTooltip(point,e.clientX,e.clientY);else hidePointTooltip()});
document.addEventListener('focusin',e=>{const point=e.target.closest?.('.point');if(point){const r=point.getBoundingClientRect();showPointTooltip(point,r.left+r.width/2,r.top)}});document.addEventListener('focusout',e=>{if(e.target.closest?.('.point'))hidePointTooltip()});
$('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
